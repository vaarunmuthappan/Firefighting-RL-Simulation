# Training configuration — Camp Fire multi-agent, PPO
algorithm: PPO
policy: CnnPolicy
total_timesteps: 800000

# PPO hyperparameters
learning_rate: 0.0003
n_steps: 2048              # standard PPO rollout — more frequent updates than 5000
batch_size: 256            # factor of 2048? 2048/256=8 mini-batches per update
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01             # small entropy bonus to keep exploration alive early
vf_coef: 0.5
max_grad_norm: 0.5

checkpoint_dir: checkpoints/
checkpoint_freq: 20000
eval_freq: 20000
eval_episodes: 3
experiment_name: Firefighting-RL-DataDriven
run_name: camp_fire_ppo_local
verbose: 1

# W&B settings
wandb_project: "Firefighting RL"

gif_freq: 10000
