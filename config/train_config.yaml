# Training configuration — Camp Fire data-driven multi-agent
algorithm: PPO
policy: CnnPolicy

# Main training budget
total_timesteps: 500000

# PPO hyperparameters
learning_rate: 0.0003
n_steps: 2048
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2

# Logging / checkpoints
checkpoint_dir: checkpoints/
checkpoint_freq: 50000
eval_episodes: 3
experiment_name: Firefighting-RL-DataDriven
run_name: camp_fire_multiagent_ppo
verbose: 1

# W&B settings
wandb_project: "Firefighting RL"

# GIF recording
gif_freq: 50000