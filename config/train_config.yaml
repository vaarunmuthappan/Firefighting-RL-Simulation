# Training configuration — Camp Fire data-driven multi-agent
algorithm: DQN
policy: CnnPolicy
total_timesteps: 200000
learning_rate: 0.0001
batch_size: 32
gamma: 0.99
buffer_size: 50000
train_freq: 4
target_update_interval: 1000
exploration_fraction: 0.3
exploration_final_eps: 0.05
checkpoint_dir: checkpoints/
checkpoint_freq: 20000
eval_freq: 20000
eval_episodes: 3
experiment_name: Firefighting-RL-DataDriven
run_name: camp_fire_multiagent
verbose: 1

# W&B settings
wandb_project: "Firefighting RL"

# GIF recording every gif_freq steps
gif_freq: 20000
