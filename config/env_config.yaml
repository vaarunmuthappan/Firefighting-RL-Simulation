# Data-driven fire environment configuration (Camp Fire, VIIRS data)
data_dir: data
fire_arrival_file: camp_fire_full_arrival_375m.npy
fire_meta_file: camp_fire_full_meta.json
roads_file: camp_fire_roads_375m.npy
population_file: camp_fire_population_375m.npy
stations_file: camp_fire_stations.json

# Terrain (SimFire for elevation/fuel observations only)
terrain_type: functional   # functional = no LANDFIRE download needed
pixel_scale: 12
resolution: 30
landfire_year: 2020
ros_attenuation: true
wind_speed: 2
wind_direction: 135.0
moisture: 0.03

# Observation channels
# agent_row_norm / agent_col_norm: CONSTANT-VALUE channels — every pixel in the
#   channel is set to the agent's normalised row (or col) coordinate [0,1].
#   Because the value is spatially uniform, 4× downsampling leaves it unchanged.
#   This is the robust fix for independent multi-agent behaviour: trucks at
#   (49,38) and (49,39) map to the same downsampled pixel, so a sparse binary
#   self_pos channel would look identical after downsampling. A constant channel
#   of 0.487 vs 0.486 is always distinguishable regardless of downsampling.
# other_agents: binary spatial — 1.0 at every OTHER agent's cell; gives the
#   policy awareness of teammates for spreading out.
attributes:
  - fire_map
  - elevation
  - w_0
  - sigma
  - delta
  - M_x
  - agent_row_norm
  - agent_col_norm
  - other_agents
normalized_attributes:
  - elevation
  - w_0
  - sigma
  - delta
  - M_x
  - agent_row_norm
  - agent_col_norm
  - other_agents

# Episode settings — shorter episodes = more training signal per hour
max_episode_steps: 5000

# Reward scale: keeps per-step rewards in ±1 range so PPO's value function
# can converge (raw rewards are ±300k; ×0.001 → ±300 per episode).
reward_scale: 0.001

# Fire timing: 36 agent sub-steps per 3-hour fire timestep (for proportional spread)
actions_per_fire_step: 36
