# Data-driven fire environment configuration (Camp Fire, VIIRS data)
data_dir: data
fire_arrival_file: camp_fire_full_arrival_375m.npy
fire_meta_file: camp_fire_full_meta.json
roads_file: camp_fire_roads_375m.npy
population_file: camp_fire_population_375m.npy
stations_file: camp_fire_stations.json

# Terrain (SimFire for elevation/fuel observations only)
terrain_type: functional
pixel_scale: 12
resolution: 30
landfire_year: 2020
ros_attenuation: true
wind_speed: 2
wind_direction: 135.0
moisture: 0.03

# Observation channels
attributes:
  - fire_map
  - elevation
  - w_0
  - sigma
  - delta
  - M_x

normalized_attributes:
  - elevation
  - w_0
  - sigma
  - delta
  - M_x

# Episode settings
# max_episode_steps: 10000
max_episode_steps: 2000
# Fire timing
actions_per_fire_step: 36

# Observation downsampling: 2x keeps ~51x54 resolution so the agent can
# see individual cell-level mitigation lines.  4x was too coarse.
obs_downsample: 2

# Limit to 1 agent for initial training — fire advances every step,
# cleaner signal, avoids all 15 trucks crowding the Paradise triangle.
# Scale up once learning is stable.
max_agents: 1

# Reward shaping
# step_penalty: small constant cost per step
# useless_noop_penalty: must be LARGER than invalid_action_penalty so sitting still
#   is worse than attempting movement — this is the key fix for the agent not moving.
# invalid_action_penalty: lower than no-op so the agent keeps trying to act even
#   when its time budget is exhausted rather than sitting still.
# move_away_fire_penalty: kept small so the agent isn't afraid to explore any direction.
step_penalty: -0.05
useless_noop_penalty: -5.0
invalid_action_penalty: -2.0
# Symmetric: oscillating gives 0 net movement reward, making it a neutral choice.
# The step_penalty makes oscillation slightly costly; building mitigation is far
# more rewarding, so the agent should prefer building over looping.
move_toward_fire_reward: 0.5
move_away_fire_penalty: -0.5
mitigation_reward: 15.0
# ahead_mitigation_reward: placed on a cell scheduled to burn within +4 fire timesteps.
# This is the primary mitigation signal — teaches blocking ahead of the spread front.
ahead_mitigation_reward: 40.0
# adjacent_mitigation_reward: placed right at the active burning edge (fallback).
# Kept small so "rush to the flame and touch it" is not the dominant strategy.
adjacent_mitigation_reward: 10.0
# line_connectivity_reward: extra bonus per already-mitigated neighbour when placing
# a new cell — creates a gradient toward building connected lines rather than scatter.
line_connectivity_reward: 25.0
# Penalise revisiting cells recently visited — breaks the A→B→A oscillation loop.
revisit_penalty: -3.0
revisit_window: 20