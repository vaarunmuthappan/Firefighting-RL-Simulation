# Agent configuration (multi-agent fire trucks)
type: DQN
movements:
  - up
  - down
  - left
  - right
interactions:
  - fireline
  - scratchline
  - wetline
initial_pos: [50, 50]
# Agents start at fire station positions (set in DataDrivenFireEnv)
# No randomize_pos needed — stations determine start positions
